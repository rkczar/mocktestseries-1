# Shared rules for media served straight from the persistent shared storage
# (/var/www/mocktestseries-shared/storage), never from a release directory.
# Installed at /etc/nginx/snippets/mocktestseries-media.conf and included
# from the media `location` blocks in sites-available/mocktestseries.in
# (see ops/nginx/README.md).
#
# Why nginx and not Next.js: `next start` indexes public/ once at boot, so a
# file uploaded after the server started 404s until the next restart
# (confirmed 2026-10-05 on a scratch server), and Next serves public/ with
# max-age=0 through Node. Media filenames are unique and never rewritten
# (random UUIDs today, content hashes later), so they are cached as immutable.

# Raster images only. Anything else under a media path is a 404 here and
# never falls through to Next.js (no SVG: same-origin script risk).
if ($uri !~* \.(webp|png|jpe?g|avif)$) {
    return 404;
}
# No dot-files or dot-directories (e.g. a stray .git/ or .trash/ in storage).
if ($uri ~ "/\.") {
    return 404;
}

limit_except GET HEAD {
    deny all;
}

# Success responses only (no `always`): a 404 must never be cached as immutable.
add_header Cache-Control "public, max-age=31536000, immutable";

# add_header in a location replaces the server-level headers, so repeat them
# (and Next's HSTS, which these responses no longer pass through).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;

autoindex off;
